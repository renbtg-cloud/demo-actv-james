name: Spring Boot real integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'adapter-springboot/**'
      - 'core/**'
      - 'store-postgres/**'
      - 'adapter-httpjdk/**'
      - 'runtime-rabbit/**'
      - 'tests/run_spring_live_acceptance.py'
      - 'tests/run_spring_fault_windows.py'
      - 'tests/run_spring_chaos.py'
      - 'tests/run_spring_same_row_race.py'
      - 'tests/run_spring_jwt_security.py'
      - 'tests/run_spring_keycloak_oidc.py'
      - 'tests/test_local_keycloak.py'
      - 'tests/test_jwks_rotation_fixture.py'
      - 'tests/test_jwt_adversarial_vectors.py'
      - 'tests/java/demo/AdmissionHttpFacadeContract.java'
      - 'tests/java/demo/StrictJsonUnicodePropertyTest.java'
      - 'tests/java/demo/StrictJsonOracle.java'
      - 'tests/test_json_python_oracle.py'
      - 'tests/test_ci_evidence_gate.py'
      - 'scripts/ci_evidence_gate.py'
      - 'scripts/package_source.py'
      - 'tests/test_source_package.py'
      - 'tests/jwt_adversarial_vectors.py'
      - 'tests/jwks_rotation_fixture.py'
      - 'scripts/local_keycloak.py'
      - 'simulator/**'
      - 'provider/**'
      - 'scripts/test-spring-real.sh'
      - '.github/workflows/spring-real-integration.yml'
  pull_request:
    paths:
      - 'adapter-springboot/**'
      - 'core/**'
      - 'store-postgres/**'
      - 'adapter-httpjdk/**'
      - 'runtime-rabbit/**'
      - 'tests/run_spring_live_acceptance.py'
      - 'tests/run_spring_fault_windows.py'
      - 'tests/run_spring_chaos.py'
      - 'tests/run_spring_same_row_race.py'
      - 'tests/run_spring_jwt_security.py'
      - 'tests/run_spring_keycloak_oidc.py'
      - 'tests/test_local_keycloak.py'
      - 'tests/test_jwks_rotation_fixture.py'
      - 'tests/test_jwt_adversarial_vectors.py'
      - 'tests/java/demo/AdmissionHttpFacadeContract.java'
      - 'tests/java/demo/StrictJsonUnicodePropertyTest.java'
      - 'tests/java/demo/StrictJsonOracle.java'
      - 'tests/test_json_python_oracle.py'
      - 'tests/test_ci_evidence_gate.py'
      - 'scripts/ci_evidence_gate.py'
      - 'scripts/package_source.py'
      - 'tests/test_source_package.py'
      - 'tests/jwt_adversarial_vectors.py'
      - 'tests/jwks_rotation_fixture.py'
      - 'scripts/local_keycloak.py'
      - 'simulator/**'
      - 'provider/**'
      - 'scripts/test-spring-real.sh'
      - '.github/workflows/spring-real-integration.yml'
jobs:
  real-spring-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [staggered-crashes, exact-fault-windows, competing-windows, dependency-interruptions, late-and-contradiction, same-row-contention, jwt-security, oidc-keycloak, local-keycloak]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: deroyque_ci
          POSTGRES_USER: deroyque_ci
          POSTGRES_PASSWORD: lab-ci-only-unsafe-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deroyque_ci -d deroyque_ci"
          --health-interval 3s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_DEFAULT_USER: deroyque_ci
          RABBITMQ_DEFAULT_PASS: lab-ci-only-rabbit-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: adapter-springboot/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare PostgreSQL client and cryptographic provider
        run: |
          # Some ephemeral ubuntu-latest images ship an unrelated Microsoft
          # repository without a signed Release for their new Ubuntu codename.
          # Disable ONLY source files containing that unused vendor endpoint;
          # never ignore apt errors from the Ubuntu repositories we depend on.
          for source_file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source_file" ]] && sudo grep -Fq 'packages.microsoft.com' "$source_file"; then
              sudo mv -- "$source_file" "$source_file.disabled"
              echo 'Disabled unused Microsoft apt source for disposable CI runner'
            fi
          done
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install 'cryptography>=42,<50' 'pika==1.3.2'
      - name: Build and test real Spring Boot — ${{ matrix.scenario }}
        env:
          DEROYQUE_PSQL: psql
          DEROYQUE_PG_HOST: 127.0.0.1
          DEROYQUE_PG_PORT: '5432'
          DEROYQUE_PG_DB: deroyque_ci
          DEROYQUE_PG_USER: deroyque_ci
          DEROYQUE_PG_PASSWORD: lab-ci-only-unsafe-not-for-production
          P13_RABBIT_HOST: 127.0.0.1
          P13_RABBIT_PORT: '5672'
          P13_RABBIT_USER: deroyque_ci
          P13_RABBIT_PASSWORD: lab-ci-only-rabbit-password
        run: |
          if [[ "${{ matrix.scenario }}" == "local-keycloak" ]]; then
            python3 -m unittest discover -s tests -p test_local_keycloak.py -v
            mvn -B -ntp -f adapter-springboot/pom.xml clean package
            python3 -u tests/run_spring_keycloak_oidc.py --use-local-keycloak --boot-jar adapter-springboot/target/deroyque-springboot-0.10.0-SNAPSHOT.jar --output "$RUNNER_TEMP/spring-local-keycloak.json"
            cat "$RUNNER_TEMP/spring-local-keycloak.json"
          elif [[ "${{ matrix.scenario }}" == "oidc-keycloak" ]]; then
            mvn -B -ntp -f adapter-springboot/pom.xml clean package
            python3 -u tests/run_spring_keycloak_oidc.py --boot-jar adapter-springboot/target/deroyque-springboot-0.10.0-SNAPSHOT.jar --output "$RUNNER_TEMP/spring-keycloak-oidc.json"
            cat "$RUNNER_TEMP/spring-keycloak-oidc.json"
          elif [[ "${{ matrix.scenario }}" == "jwt-security" ]]; then
            python3 -m unittest discover -s tests -p test_jwks_rotation_fixture.py -v
            python3 -m unittest discover -s tests -p test_jwt_adversarial_vectors.py -v
            mkdir -p "$RUNNER_TEMP/deroyque-core-contract"
            javac --release 21 -encoding UTF-8 -d "$RUNNER_TEMP/deroyque-core-contract" \
              core/src/main/java/demo/{RequestOperations,IngressMeasurements,StrictJson,AdmissionHttpFacade}.java \
              tests/java/demo/AdmissionHttpFacadeContract.java
            java -cp "$RUNNER_TEMP/deroyque-core-contract" demo.AdmissionHttpFacadeContract
            javac --release 21 -encoding UTF-8 -cp "$RUNNER_TEMP/deroyque-core-contract" \
              -d "$RUNNER_TEMP/deroyque-core-contract" tests/java/demo/StrictJsonUnicodePropertyTest.java
            java -cp "$RUNNER_TEMP/deroyque-core-contract" demo.StrictJsonUnicodePropertyTest
            javac --release 21 -encoding UTF-8 -cp "$RUNNER_TEMP/deroyque-core-contract" \
              -d "$RUNNER_TEMP/deroyque-core-contract" tests/java/demo/StrictJsonOracle.java
            python3 tests/test_json_python_oracle.py --classes "$RUNNER_TEMP/deroyque-core-contract"
            mvn -B -ntp -f adapter-springboot/pom.xml clean package
            python3 -u tests/run_spring_jwt_security.py --boot-jar adapter-springboot/target/deroyque-springboot-0.10.0-SNAPSHOT.jar --output "$RUNNER_TEMP/spring-jwt-security.json"
            cat "$RUNNER_TEMP/spring-jwt-security.json"
          elif [[ "${{ matrix.scenario }}" == "staggered-crashes" ]]; then
            ./scripts/test-spring-real.sh --adversarial-max-jvms 24 --adversarial-service-jvms 4 --adversarial-crashes 2 --output "$RUNNER_TEMP/spring-real-result.json"
            cat "$RUNNER_TEMP/spring-real-result.json"
          elif [[ "${{ matrix.scenario }}" == "exact-fault-windows" ]]; then
            mvn -B -ntp -f adapter-springboot/pom.xml clean package
            python3 -u tests/run_spring_fault_windows.py --boot-jar adapter-springboot/target/deroyque-springboot-0.10.0-SNAPSHOT.jar --output "$RUNNER_TEMP/spring-fault-windows.json"
            cat "$RUNNER_TEMP/spring-fault-windows.json"
          elif [[ "${{ matrix.scenario }}" == "same-row-contention" ]]; then
            mvn -B -ntp -f adapter-springboot/pom.xml clean package
            python3 -u tests/run_spring_same_row_race.py --boot-jar adapter-springboot/target/deroyque-springboot-0.10.0-SNAPSHOT.jar --output "$RUNNER_TEMP/spring-same-row-race.json"
            cat "$RUNNER_TEMP/spring-same-row-race.json"
          else
            mvn -B -ntp -f adapter-springboot/pom.xml clean package
            export DEROYQUE_CHAOS_PG_JAR="$(find "$HOME/.m2/repository/org/postgresql/postgresql" -name 'postgresql-*.jar' | head -1)"
            test -f "$DEROYQUE_CHAOS_PG_JAR"
            python3 -u tests/run_spring_chaos.py --scenario "${{ matrix.scenario }}" --boot-jar adapter-springboot/target/deroyque-springboot-0.10.0-SNAPSHOT.jar --output "$RUNNER_TEMP/spring-chaos-result.json"
            cat "$RUNNER_TEMP/spring-chaos-result.json"
          fi
      - name: Validate assertion evidence — ${{ matrix.scenario }}
        run: |
          python3 -m unittest discover -s tests -p test_ci_evidence_gate.py -v
          python3 scripts/ci_evidence_gate.py \
            --scenario "${{ matrix.scenario }}" \
            --result-dir "$RUNNER_TEMP" \
            --summary-path "$GITHUB_STEP_SUMMARY"
      # No raw JVM/provider logs, database dumps, keys, or credentials are uploaded.

  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic packaging and archive-integrity checks
        run: |
          python3 -m unittest discover -s tests -p test_source_package.py -v
          python3 scripts/package_source.py --root . --output "$RUNNER_TEMP/deroyque-git-source.zip"
          python3 scripts/package_source.py --verify-only --output "$RUNNER_TEMP/deroyque-git-source.zip"
      - name: Publish Git-tracked-only source bundle
        uses: actions/upload-artifact@v4
        with:
          name: deroyque-verified-source
          path: ${{ runner.temp }}/deroyque-git-source.zip
          if-no-files-found: error
          retention-days: 7

  verify-published-source:
    needs: source-archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the independently published source ZIP
        uses: actions/download-artifact@v4
        with:
          name: deroyque-verified-source
          path: ${{ runner.temp }}/published-source
      - name: Rebuild canonical ZIP and compare entire bytes on fresh checkout
        run: |
          python3 -m unittest discover -s tests -p test_source_package.py -v
          python3 scripts/package_source.py --verify-reproducible \
            --root . --output "$RUNNER_TEMP/published-source/deroyque-git-source.zip"

  simulator-lab-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify independent simulator, multi-JVM and host evidence contracts
        run: |
          python3 -m pip install 'PyYAML>=6.0,<7.0'
          python3 -m unittest discover -s simulator/tests -v
